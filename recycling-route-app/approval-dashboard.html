<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approval Dashboard | ReRoute Collect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
  <div class="dashboard-layout">
    <aside class="sidebar glass-card">
      <a class="brand" href="index.html"><i class="fa-solid fa-recycle"></i> ReRoute Collect</a>
      <nav>
        <a href="route-plan.html"><i class="fa-solid fa-file-signature"></i> Submit Route Plan</a>
        <a class="active" href="approval-dashboard.html"><i class="fa-solid fa-user-check"></i> Approval Dashboard</a>
        <a href="collection-completion.html"><i class="fa-solid fa-clipboard-check"></i> Collection Completion</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header glass-card">
        <h1>Approval Dashboard</h1>
        <div class="dashboard-controls">
          <label><i class="fa-solid fa-search"></i><input id="searchRoute" type="search" placeholder="Search route, collector, ID..." /></label>
          <select id="statusFilter">
            <option value="all">All statuses</option>
            <option value="Pending Approval">Pending Approval</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </header>

      <section class="summary-grid" id="summaryCards"></section>

      <section class="glass-card table-card">
        <h2><i class="fa-solid fa-table"></i> Route Plans</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Route ID</th>
                <th>Collector</th>
                <th>Date</th>
                <th>Route Name</th>
                <th>Material</th>
                <th>Points</th>
                <th>Expected Qty</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="routesTableBody"></tbody>
          </table>
          <div id="tableEmpty" class="empty-state hidden">
            <i class="fa-regular fa-folder-open"></i>
            <p>No route plans match the current filters.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="routeDetailsModal" class="route-modal">
    <div class="route-modal-content glass-card">
      <div class="modal-header">
        <h3>Route Details</h3>
        <button id="closeModal" class="btn btn-secondary">Close</button>
      </div>
      <div id="routeDetailsBody"></div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
